name: Test synthetic OEM lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the existing Excel test extra
        run: python -m pip install -e ".[excel]"
      - name: Verify Excel tests have their dependency
        run: python -c "import openpyxl; print('openpyxl', openpyxl.__version__)"
      - name: Run the complete offline suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Evaluate the five synthetic scenarios offline
        run: python -m oem_agent.stage5_eval offline --out runs/ci-eval-5-5-offline
