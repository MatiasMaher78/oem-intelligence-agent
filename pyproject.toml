[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oem-intelligence-agent"
version = "0.1.0"
description = "Synthetic automotive OEM intelligence agent lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5,<4"]
llm = ["openai-agents"]

[tool.setuptools.packages.find]
include = ["oem_agent*"]
